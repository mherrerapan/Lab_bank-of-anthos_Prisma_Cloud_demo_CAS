name: Prisma Cloud IaC Scan (Docker Image Version)

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  kubernetes-scan:
    runs-on: ubuntu-latest
    # This tells the runner to execute the job inside the Checkov container
    container:
      image: bridgecrew/checkov:latest 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Prisma Cloud Scan via CLI in Container
        env:
          PRISMA_API_URL: https://api2.prismacloud.io 
          BC_SOURCE: githubActions
        run: |
          checkov --directory ${{ github.workspace }}/k8s-manifests \
            --framework kubernetes \
            --quiet \
            --prisma-api-url $PRISMA_API_URL \
            --bc-api-key ${{ secrets.PC_API_KEY }} \
            --repo-id ${{ github.repository }} \
            --branch ${{ github.ref_name }} \
            --use-enforcement-rules \
            -o cli -o sarif \
            --output-file-path console,results.sarif