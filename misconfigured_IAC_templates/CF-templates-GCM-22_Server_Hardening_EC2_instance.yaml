AWSTemplateFormatVersion: '2010-09-09'
Resources:
  VulnerableEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0c55b159cbfafe1f0
      # VULNERABLE: Missing MetadataOptions (defaults to IMDSv1)
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            # VULNERABLE: Encrypted is omitted/false